<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Translator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>PDF Translator</h1>
        <form id="uploadForm">
            <div class="form-group">
                <label for="fileInput">Select PDF Document</label>
                <input type="file" id="fileInput" name="file" accept="application/pdf" required>
            </div>
            
            <div class="form-group">
                <label for="languageSelect">Target Language</label>
                <select id="languageSelect" name="language" required>
                    <!-- Options injected via JavaScript -->
                </select>
            </div>
            
            <button type="submit" id="submitBtn">Translate Document</button>
        </form>
        <div id="status"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
