services:
  manager:
    build:
      context: ./manager
    image: pdf-translator-manager:latest
    ports:
      - "8000:8000"
    environment:
      - S3_USER=${SYS_ADMIN_USER}
      - S3_PASS=${SYS_ADMIN_PASS}
      - RMQ_USER=${SYS_ADMIN_USER}
      - RMQ_PASS=${SYS_ADMIN_PASS}
    depends_on:
      ocr:
        condition: service_started
      translate:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      s3:
        condition: service_healthy

  ocr:
    build:
      context: ./ocr
    image: pdf-translator-ocr:latest
    environment:
      - AIP_HTTP_PORT=8001
      - MODEL_GCS_PATH=/models
      - S3_USER=${SYS_ADMIN_USER}
      - S3_PASS=${SYS_ADMIN_PASS}
      - RMQ_USER=${SYS_ADMIN_USER}
      - RMQ_PASS=${SYS_ADMIN_PASS}
    ports:
      - "8001:8001"
    volumes:
      - ./models:/models 
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      rabbitmq:
        condition: service_healthy
      s3:
        condition: service_healthy

  translate:
    build:
      context: ./translate
    image: pdf-translator-translate:latest
    environment:
      - AIP_HTTP_PORT=8002
      - MODEL_GCS_PATH=/models/Hy-MT2-7B
      - S3_USER=${SYS_ADMIN_USER}
      - S3_PASS=${SYS_ADMIN_PASS}
      - RMQ_USER=${SYS_ADMIN_USER}
      - RMQ_PASS=${SYS_ADMIN_PASS}
    ports:
      - "8002:8002"
    volumes:
      - ./models/Hy-MT2-7B:/models/Hy-MT2-7B 
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      rabbitmq:
        condition: service_healthy
      s3:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq_broker
    ports:
      - "5672:5672" 
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${SYS_ADMIN_USER}
      RABBITMQ_DEFAULT_PASS: ${SYS_ADMIN_PASS}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5

  s3:
    image: chrislusf/seaweedfs:latest
    container_name: s3_storage
    ports:
      - "8333:8333"
      - "9333:9333" 
    command: "server -s3 -s3.config=/etc/seaweedfs/s3.json"
    volumes:
      - s3_data:/data
      - ./s3.json:/etc/seaweedfs/s3.json
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9333/"]
      interval: 10s
      timeout: 5s
      retries: 5
      
  frontend:
    image: nginx:alpine
    container_name: web_frontend
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - manager
      
volumes:
  rabbitmq_data:
  s3_data: